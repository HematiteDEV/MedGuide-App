<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedGuide Offline</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#047857">
  <style>
    :root {
      --bg-main: #f4f4f5;
      --bg-card: #ffffff;
      --text-main: #18181b;
      --text-mut: #52525b;
      --border: #e4e4e7;
      --primary: #047857;
      --primary-light: #10b981;
    }
    body.dark-mode {
      --bg-main: #18181b;
      --bg-card: #27272a;
      --text-main: #f4f4f5;
      --text-mut: #a1a1aa;
      --border: #3f3f46;
      --primary: #047857;
    }
    body { font-family: Tahoma, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; transition: background 0.3s; }
    
    .app-container { max-width: 600px; margin: 0 auto; padding: 15px; }
    
    /* سربرگ */
    header { 
      background: var(--primary); 
      color: white; 
      padding: 1.5rem 1rem; 
      text-align: center; 
      border-radius: 20px; 
      position: relative;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    header h1 { margin: 0; font-size: 1.9rem; font-weight: bold; letter-spacing: 1px;}
    header p { margin: 5px 0 0 0; color: #a7f3d0; font-size: 1rem; }
    
    .theme-btn { 
      position: absolute; 
      left: 15px; 
      top: 50%; 
      transform: translateY(-50%); 
      background: none; 
      border: none; 
      font-size: 1.6rem; 
      cursor: pointer; 
    }

    /* کادر جستجو */
    .search-container { margin-top: 15px; }
    input[type="text"] { 
      width: 100%; 
      padding: 1.1rem 1.2rem; 
      font-size: 1.05rem; 
      border-radius: 18px; 
      border: 1px solid var(--border); 
      background: var(--bg-card); 
      color: var(--text-main); 
      box-sizing: border-box; 
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary-light); }

    /* دکمه‌های فیلتر سریع */
    .filter-container { 
      display: flex; 
      gap: 8px; 
      margin-top: 15px; 
      overflow-x: auto; 
      padding-bottom: 5px;
      /* مخفی کردن اسکرول‌بار */
      -ms-overflow-style: none;  
      scrollbar-width: none;  
    }
    .filter-container::-webkit-scrollbar { display: none; }
    .filter-btn { 
      white-space: nowrap; 
      padding: 8px 16px; 
      background: var(--bg-card); 
      color: var(--text-mut); 
      border: 1px solid var(--border); 
      border-radius: 20px; 
      cursor: pointer; 
      font-family: Tahoma, sans-serif; 
      font-size: 0.95rem; 
      transition: all 0.2s; 
    }
    .filter-btn.active { 
      background: var(--primary); 
      color: white; 
      border-color: var(--primary); 
    }

    /* لیست داروها */
    #medList { margin-top: 15px; display: grid; gap: 12px; }
    .card { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 1.2rem; 
      cursor: pointer; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
    }
    .en-title { font-weight: bold; font-size: 1.15rem; }
    .fa-title { color: var(--primary-light); font-size: 1.1rem; margin-top: 5px; }
    
    /* صفحه جزئیات */
    .hidden { display: none !important; }
    #detail-view { padding: 10px 0; }
    .back-btn { background: none; border: none; color: var(--primary); font-weight: bold; cursor: pointer; margin-bottom: 15px; font-size: 1.1rem; padding: 0;}
    .detail-box { background: var(--bg-card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <button onclick="toggleDarkMode()" class="theme-btn">🌙</button>
      <h1>MedGuide</h1>
      <p>دانشنامه آفلاین داروهای ایران</p>
    </header>

    <div id="main-view">
      <div class="search-container">
        <input id="searchInput" type="text" placeholder="جستجوی دارو (فارسی یا انگلیسی)..." autocomplete="off">
      </div>
      
      <div class="filter-container" id="filterContainer">
        <button class="filter-btn active" data-filter="all">همه داروها</button>
        <button class="filter-btn" data-filter="مسکن">💊 مسکن و درد</button>
        <button class="filter-btn" data-filter="عفونت">🦠 آنتی‌بیوتیک</button>
        <button class="filter-btn" data-filter="قلب">🫀 قلب و فشار خون</button>
        <button class="filter-btn" data-filter="معده">🤢 گوارش و معده</button>
        <button class="filter-btn" data-filter="حساسیت">🤧 حساسیت و آلرژی</button>
        <button class="filter-btn" data-filter="ویتامین">🍏 ویتامین و مکمل</button>
      </div>

      <div id="medList"></div>
    </div>

    <div id="detail-view" class="hidden">
      <button onclick="goBack()" class="back-btn">← بازگشت به لیست</button>
      <div class="detail-box">
        <h2 id="det-en" style="margin:0; font-size: 1.8rem;"></h2>
        <p id="det-fa" style="color: var(--primary-light); font-size: 1.4rem; font-weight: bold; margin: 10px 0;"></p>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
        <p id="det-desc" style="line-height: 2; font-size: 1.15rem;"></p>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
